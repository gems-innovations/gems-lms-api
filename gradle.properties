# Faster local builds: build modules in parallel and reuse outputs of unchanged tasks.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Minimum line coverage enforced by `check` (override with -PcoverageMinimum=0.7).
# Baseline 2026-10: ms-auth 71%, ms-admin 73%, ms-education 52%. Raise it as coverage grows.
coverageMinimum=0.50

# Library versions shared by several modules (Spring Boot itself is pinned in build.gradle).
# Boot's BOM manages the rest; bump these together with it and re-scan the dependencies.
springCloudVersion=2025.0.3
springdocVersion=2.8.17
jjwtVersion=0.11.5
awsSdkVersion=2.55.12

# Security pins: patch releases newer than the ones Spring Boot's BOM manages, picked after scanning the
# resolved classpath against OSV (GHSA advisories). Drop each line when Boot's own BOM catches up.
jackson-bom.version=2.21.7
netty.version=4.1.139.Final
commons-lang3.version=3.20.0
log4j2.version=2.26.1
httpclient5.version=5.6.4
httpcore5.version=5.4.4
