# Education Microservice Configuration
server.port=${EDUCATION_PORT:8081}
spring.application.name=ms-education

# R2DBC Configuration
spring.r2dbc.url=${EDUCATION_R2DBC_URL:r2dbc:postgresql://localhost:5434/education_db}
spring.r2dbc.username=${EDUCATION_R2DBC_USERNAME:education_user}
spring.r2dbc.password=${EDUCATION_R2DBC_PASSWORD:education_password}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:redis_password}

# JWT Configuration
jwt.secret=${JWT_SECRET:mySecretKey123456789012345678901234567890}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Auth Configuration
auth.login.path=${AUTH_LOGIN_PATH:/api/v1/auth/login}

# Rate Limiting Configuration
rate.limit.requests=${RATE_LIMIT_REQUESTS:100}
rate.limit.window=${RATE_LIMIT_WINDOW:60}
rate.limit.key.prefix=${RATE_LIMIT_KEY_PREFIX:rate_limit:}

# Logging configuration
logging.level.com.gems.education=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.r2dbc=DEBUG

# Management endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}
cors.max-age=${CORS_MAX_AGE:3600}

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
