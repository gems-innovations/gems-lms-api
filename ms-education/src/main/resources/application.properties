# Education Microservice Configuration
server.port=${EDUCATION_PORT:8083}
spring.application.name=ms-education

# R2DBC Configuration
spring.r2dbc.url=${EDUCATION_R2DBC_URL:r2dbc:postgresql://localhost:5434/education_db}
spring.r2dbc.username=${EDUCATION_R2DBC_USERNAME:education_user}
spring.r2dbc.password=${EDUCATION_R2DBC_PASSWORD:education_password}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Auth Configuration
auth.login.path=${AUTH_LOGIN_PATH:/api/v1/auth/login}

# Rate Limiting Configuration
rate.limit.requests=${RATE_LIMIT_REQUESTS:100}
rate.limit.window=${RATE_LIMIT_WINDOW:60}
rate.limit.key.prefix=${RATE_LIMIT_KEY_PREFIX:rate_limit:}

# Logging configuration
logging.level.com.gems.education=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.r2dbc=DEBUG

# Management endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.show-details=when-authorized

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}
cors.max-age=${CORS_MAX_AGE:3600}

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Uploads: local directory (replace LocalFileStorage to use an object store) and size limit.
files.dir=${FILES_DIR:./data/uploads}
files.max-size-bytes=${FILES_MAX_SIZE_BYTES:10485760}
files.storage=${FILES_STORAGE:local}
files.s3.bucket=${S3_BUCKET:}
files.s3.region=${S3_REGION:us-east-1}
files.s3.endpoint=${S3_ENDPOINT:}
files.s3.path-style=${S3_PATH_STYLE:false}
files.s3.prefix=${S3_PREFIX:uploads}
spring.webflux.multipart.max-disk-usage-per-part=${FILES_MAX_SIZE_BYTES:10485760}

# ms-auth, asked to confirm that users belong to an institution before enrolling them.
services.auth.url=${AUTH_SERVICE_URL:http://localhost:${AUTH_PORT:8081}}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
