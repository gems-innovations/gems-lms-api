name: Java CI/CD with Gradle & Docker

on:
  push:
    branches: [ "develop", "qa", "main" ]
  pull_request:
    branches: [ "develop", "qa", "main" ]

env:
  # Define environment based on branch
  DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'pdn' || github.ref == 'refs/heads/qa' && 'qa' || 'dev' }}

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up JDK 24
      uses: actions/setup-java@v6
      with:
        java-version: '24'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Validate production compose
      run: docker compose --env-file .env.production.example config --quiet
      
    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: '**/build/reports/tests/'

  docker-build-push:
    needs: build-and-test
    if: github.event_name == 'push' # Only build/push docker images on push, not PR
    # La VM de Oracle es ARM (Ampere): se compila nativo en un runner ARM, sin emulación.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [ms-auth, ms-admin, ms-education, api-gateway]
    steps:
    - uses: actions/checkout@v7

    - uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./${{ matrix.service }}/Dockerfile
        push: true
        platforms: linux/arm64
        cache-from: type=gha,scope=${{ matrix.service }}
        cache-to: type=gha,mode=max,scope=${{ matrix.service }}
        labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
        tags: |
          ghcr.io/gems-innovations/${{ matrix.service }}:${{ github.sha }}
          ghcr.io/gems-innovations/${{ matrix.service }}:${{ env.DEPLOY_ENV }}-latest

  deploy:
    needs: docker-build-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment: ${{ github.ref == 'refs/heads/main' && 'pdn' || github.ref == 'refs/heads/qa' && 'qa' || 'dev' }}
    steps:
    - uses: actions/checkout@v7

    - name: Copy docker-compose.yml to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        source: "docker-compose.yml,ops/validate-production-env.sh"
        target: "/home/${{ secrets.VM_USER }}/app"

    - name: Deploy to ${{ env.DEPLOY_ENV }}
      uses: appleboy/ssh-action@v1.0.3
      env:
        GHCR_USER: ${{ github.actor }}
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        envs: GHCR_USER,GHCR_TOKEN
        script: |
          set -eu
          cd /home/${{ secrets.VM_USER }}/app
          sh ops/validate-production-env.sh .env
          docker compose --env-file .env config --quiet
          # Sesión de ghcr propia del despliegue (token temporal del workflow), aparte de la del sistema.
          export DOCKER_CONFIG="$HOME/app/.docker-ci"
          mkdir -p "$DOCKER_CONFIG"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          # Solo las imágenes de este repo; gems-web la publica y la despliega gems-lms-web.
          docker compose --env-file .env pull api-gateway ms-auth ms-admin ms-education postgres-auth postgres-admin postgres-education redis
          docker compose --env-file .env up -d --remove-orphans
          docker logout ghcr.io
          docker image prune -f
