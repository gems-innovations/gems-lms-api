name: Java CI/CD with Gradle & Docker

on:
  push:
    branches: [ "develop", "qa", "main" ]
  pull_request:
    branches: [ "develop", "qa", "main" ]

env:
  # Define environment based on branch
  DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'pdn' || github.ref == 'refs/heads/qa' && 'qa' || 'dev' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 24
      uses: actions/setup-java@v4
      with:
        java-version: '24'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build
      
    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: '**/build/reports/tests/'

  docker-build-push:
    needs: build-and-test
    if: github.event_name == 'push' # Only build/push docker images on push, not PR
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ms-auth, ms-admin, ms-education]
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 24
      uses: actions/setup-java@v4
      with:
        java-version: '24'
        distribution: 'temurin'

    # Build JAR first (could be optimized by downloading artifact from previous job, but rebuilding is often faster/simpler)
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build JAR for ${{ matrix.service }}
      run: ./gradlew :${{ matrix.service }}:bootJar

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./${{ matrix.service }}/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:latest
          ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
          ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:${{ env.DEPLOY_ENV }}-latest

  deploy:
    needs: docker-build-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'pdn' || github.ref == 'refs/heads/qa' && 'qa' || 'dev' }}
    steps:
    - name: Deploy to ${{ env.DEPLOY_ENV }}
      run: |
        echo "Deploying to environment: ${{ env.DEPLOY_ENV }}"
        echo "Pulling images tagged with: ${{ env.DEPLOY_ENV }}-latest"
        # Add actual deployment commands here (e.g., SSH to server, kubectl apply, etc.)
        # Example:
        # ssh user@server "docker-compose pull && docker-compose up -d"
