name: Java CI/CD with Gradle & Docker

on:
  push:
    branches: [ "develop", "qa", "main" ]
  pull_request:
    branches: [ "develop", "qa", "main" ]

env:
  # Define environment based on branch
  DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'pdn' || github.ref == 'refs/heads/qa' && 'qa' || 'dev' }}

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up JDK 24
      uses: actions/setup-java@v6
      with:
        java-version: '24'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Validate production compose
      run: docker compose --env-file .env.production.example config --quiet
      
    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: '**/build/reports/tests/'

  docker-build-push:
    needs: build-and-test
    if: github.event_name == 'push' # Only build/push docker images on push, not PR
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ms-auth, ms-admin, ms-education, api-gateway]
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up JDK 24
      uses: actions/setup-java@v6
      with:
        java-version: '24'
        distribution: 'temurin'

    - uses: docker/setup-qemu-action@v3
    - uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./${{ matrix.service }}/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
          ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:${{ env.DEPLOY_ENV }}-latest

  deploy:
    needs: docker-build-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'pdn' || github.ref == 'refs/heads/qa' && 'qa' || 'dev' }}
    steps:
    - uses: actions/checkout@v7

    - name: Copy docker-compose.yml to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        source: "docker-compose.yml,nginx,ops/validate-production-env.sh"
        target: "/home/${{ secrets.VM_USER }}/app"

    - name: Deploy to ${{ env.DEPLOY_ENV }}
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          set -eu
          cd /home/${{ secrets.VM_USER }}/app
          sh ops/validate-production-env.sh .env
          docker compose --env-file .env config --quiet
          docker compose pull
          docker compose up -d --remove-orphans
