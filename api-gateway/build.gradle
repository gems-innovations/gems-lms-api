plugins {
  id 'org.springframework.boot'
  id 'io.spring.dependency-management'
}

dependencyManagement {
  imports {
    mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
  }
}

// webflux, actuator, prometheus and the test starters come from the root build.gradle;
// the JWT libraries come with :shared.
dependencies {
  implementation project(':shared')
  implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
  implementation 'org.springframework.boot:spring-boot-starter-security'
  implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
}

// spring-cloud-starter brings Bouncy Castle (for encrypted properties, which the gateway does not use) at a
// version with advisories. Keep the three artifacts on the same, patched release.
configurations.configureEach {
  resolutionStrategy.eachDependency { details ->
    if (details.requested.group == 'org.bouncycastle') {
      details.useVersion '1.86'
    }
  }
}
