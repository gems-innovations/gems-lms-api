# API Gateway Configuration
server.port=${API_GATEWAY_PORT}
spring.application.name=api-gateway

# Internal Authentication
gateway.internal.secret=${GATEWAY_INTERNAL_SECRET}
gateway.internal.header=${GATEWAY_INTERNAL_HEADER}

# Microservices Configuration
microservices.auth.url=${AUTH_SERVICE_URL}
microservices.auth.id=${AUTH_SERVICE_ID}
microservices.auth.path=${AUTH_SERVICE_PATH}

microservices.admin.url=${ADMIN_SERVICE_URL}
microservices.admin.id=${ADMIN_SERVICE_ID}
microservices.admin.path=${ADMIN_SERVICE_PATH}

microservices.education.url=${EDUCATION_SERVICE_URL}
microservices.education.id=${EDUCATION_SERVICE_ID}
microservices.education.path=${EDUCATION_SERVICE_PATH}

# Logging configuration
logging.level.com.gems.admin=INFO
logging.level.org.springframework.web=INFO

# Management endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Redis Configuration
spring.redis.host=${REDIS_HOST}
spring.redis.port=${REDIS_PORT}
spring.redis.password=${REDIS_PASSWORD}

# Rate Limiting Configuration
rate.limit.requests=${RATE_LIMIT_REQUESTS}
rate.limit.window=${RATE_LIMIT_WINDOW}
rate.limit.key.prefix=${RATE_LIMIT_KEY_PREFIX}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
cors.allowed-methods=${CORS_ALLOWED_METHODS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS}
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS}
cors.max-age=${CORS_MAX_AGE}