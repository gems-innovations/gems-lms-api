server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: "${REDIS_HOST:localhost}"
      port: ${REDIS_PORT:6379}
      password: "${REDIS_PASSWORD}"
  cloud:
    gateway:
      default-filters:
        # Both this gateway and each downstream microservice apply their own CorsWebFilter
        # (shared.security.CorsConfig). When the gateway proxies a response that already
        # carries CORS headers, its own filter adds them again, so the header ends up
        # duplicated on the way to the browser — which then rejects the response outright.
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Expose-Headers Vary X-Content-Type-Options X-Frame-Options X-XSS-Protection Strict-Transport-Security Content-Security-Policy Referrer-Policy Permissions-Policy X-Permitted-Cross-Domain-Policies, RETAIN_UNIQUE
      routes:
        - id: ms-auth-auth
          uri: http://localhost:${AUTH_PORT:8081}
          predicates:
            - Path=/api/v1/auth/**

        - id: ms-auth-users
          uri: http://localhost:${AUTH_PORT:8081}
          predicates:
            - Path=/api/v1/users/**

        - id: ms-admin-institutions
          uri: http://localhost:${ADMIN_PORT:8082}
          predicates:
            - Path=/api/v1/institutions/**

        - id: ms-admin-branding
          uri: http://localhost:${ADMIN_PORT:8082}
          predicates:
            - Path=/api/v1/branding/**

        - id: ms-education-courses
          uri: http://localhost:${EDUCATION_PORT:8083}
          predicates:
            - Path=/api/v1/courses/**

        - id: ms-education-students
          uri: http://localhost:${EDUCATION_PORT:8083}
          predicates:
            - Path=/api/v1/students/**

        - id: ms-education-quizzes
          uri: http://localhost:${EDUCATION_PORT:8083}
          predicates:
            - Path=/api/v1/quizzes/**

        - id: ms-education-learning-paths
          uri: http://localhost:${EDUCATION_PORT:8083}
          predicates:
            - Path=/api/v1/learning-paths/**

        - id: ms-education-activity
          uri: http://localhost:${EDUCATION_PORT:8083}
          predicates:
            - Path=/api/v1/activity/**,/api/v1/submissions/**

        - id: ms-education-notifications
          uri: http://localhost:${EDUCATION_PORT:8083}
          predicates:
            - Path=/api/v1/notifications/**

        - id: ms-education-files
          uri: http://localhost:${EDUCATION_PORT:8083}
          predicates:
            - Path=/api/v1/files/**

        - id: ms-education-groups
          uri: http://localhost:${EDUCATION_PORT:8083}
          predicates:
            - Path=/api/v1/groups/**

        - id: ms-education-enrollments
          uri: http://localhost:${EDUCATION_PORT:8083}
          predicates:
            - Path=/api/v1/enrollments/**

jwt:
  secret: "${JWT_SECRET}"
  expiration: 86400000

auth:
  login:
    path: "/api/v1/auth/login"

rate:
  limit:
    requests: ${RATE_LIMIT_REQUESTS:100}
    window: ${RATE_LIMIT_WINDOW:60}
    key:
      prefix: "${RATE_LIMIT_KEY_PREFIX:rate_limit:}"

cors:
  allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}"
  allowed-methods: "${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}"
  allowed-headers: "${CORS_ALLOWED_HEADERS:*}"
  allow-credentials: true
  max-age: 3600
