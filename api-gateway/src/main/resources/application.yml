server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: "${REDIS_HOST:localhost}"
      port: ${REDIS_PORT:6379}
      password: "${REDIS_PASSWORD:redis_password}"
  cloud:
    gateway:
      routes:
        - id: ms-auth-auth
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/auth/**

        - id: ms-auth-users
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/users/**

        - id: ms-admin-institutions
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/institutions/**

        - id: ms-admin-branding
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/branding/**

        - id: ms-education-courses
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/courses/**

        - id: ms-education-students
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/students/**

        - id: ms-education-quizzes
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/quizzes/**

        - id: ms-education-learning-paths
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/learning-paths/**

        - id: ms-education-enrollments
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/enrollments/**

jwt:
  secret: "${JWT_SECRET:mySecretKey123456789012345678901234567890}"
  expiration: 86400000

auth:
  login:
    path: "/api/v1/auth/login"

rate:
  limit:
    requests: ${RATE_LIMIT_REQUESTS:100}
    window: ${RATE_LIMIT_WINDOW:60}
    key:
      prefix: "${RATE_LIMIT_KEY_PREFIX:rate_limit:}"

cors:
  allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}"
  allowed-methods: "${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}"
  allowed-headers: "${CORS_ALLOWED_HEADERS:*}"
  allow-credentials: true
  max-age: 3600
