# Front (imagen gems-web). Cambia el dominio si no es lms.gemsinnovations.com
# y emite su certificado con ops/setup-vm.sh.
server {
    listen 80;
    server_name lms.gemsinnovations.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name lms.gemsinnovations.com;

    ssl_certificate /etc/letsencrypt/live/lms.gemsinnovations.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lms.gemsinnovations.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
