server_tokens off;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:GEMS:10m;
ssl_session_timeout 1d;

server {
    listen 80;
    server_name api.auth.gemsinnovations.com api.admin.gemsinnovations.com api.edu.gemsinnovations.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.auth.gemsinnovations.com;

    # Single API entry point used by gems-lms-web. Allow multipart uploads up to the API limit.
    client_max_body_size 11m;

    ssl_certificate /etc/letsencrypt/live/api.auth.gemsinnovations.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.auth.gemsinnovations.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /actuator/prometheus { return 404; }
    location ~ ^/(swagger-ui|v3/api-docs|webjars)(/|$) { return 404; }

    location / {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name api.admin.gemsinnovations.com;

    ssl_certificate /etc/letsencrypt/live/api.auth.gemsinnovations.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.auth.gemsinnovations.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /actuator/prometheus { return 404; }
    location ~ ^/(swagger-ui|v3/api-docs|webjars)(/|$) { return 404; }

    # Legacy hostname kept as an alias. All requests still cross the gateway so
    # rate limiting, session validation and audit logging cannot be bypassed.
    location / {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name api.edu.gemsinnovations.com;

    client_max_body_size 11m;

    ssl_certificate /etc/letsencrypt/live/api.auth.gemsinnovations.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.auth.gemsinnovations.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /actuator/prometheus { return 404; }
    location ~ ^/(swagger-ui|v3/api-docs|webjars)(/|$) { return 404; }

    # Legacy hostname kept as an alias. Route through the single API boundary.
    location / {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
