# Auth Microservice Configuration
server.port=${AUTH_PORT:8082}
spring.application.name=ms-auth

# R2DBC Configuration
spring.r2dbc.url=${AUTH_R2DBC_URL:r2dbc:postgresql://localhost:5433/auth_db}
spring.r2dbc.username=${AUTH_R2DBC_USERNAME:auth_user}
spring.r2dbc.password=${AUTH_R2DBC_PASSWORD:auth_password}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Auth Configuration
auth.login.path=${AUTH_LOGIN_PATH:/api/v1/auth/login}

# Rate Limiting Configuration
rate.limit.requests=${RATE_LIMIT_REQUESTS:100}
rate.limit.window=${RATE_LIMIT_WINDOW:60}
rate.limit.key.prefix=${RATE_LIMIT_KEY_PREFIX:rate_limit:}

# Logging configuration
logging.level.com.gems.auth=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.r2dbc=DEBUG
logging.level.org.springframework.validation=DEBUG
logging.level.org.springframework.web.reactive=DEBUG

# Management endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}
cors.max-age=${CORS_MAX_AGE:3600}

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# First super admin, created at startup when both are set (see SuperAdminBootstrap)
bootstrap.super-admin.email=${BOOTSTRAP_SUPERADMIN_EMAIL:}
bootstrap.super-admin.password=${BOOTSTRAP_SUPERADMIN_PASSWORD:}

# Base URL of the web app, used to build links sent to users (password reset).
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# E-mail (password reset links). Without MAIL_HOST the links go to the log.
app.mail.host=${MAIL_HOST:}
app.mail.port=${MAIL_PORT:587}
app.mail.username=${MAIL_USERNAME:}
app.mail.password=${MAIL_PASSWORD:}
app.mail.starttls=${MAIL_STARTTLS:true}
app.mail.from=${MAIL_FROM:no-reply@gems.lms}
