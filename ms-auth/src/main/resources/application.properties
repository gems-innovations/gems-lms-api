# Auth Microservice Configuration
server.port=${AUTH_PORT}
spring.application.name=ms-auth

# R2DBC Configuration
spring.r2dbc.url=${AUTH_R2DBC_URL}
spring.r2dbc.username=${AUTH_R2DBC_USERNAME}
spring.r2dbc.password=${AUTH_R2DBC_PASSWORD}

# Logging configuration
logging.level.com.gems.auth=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.r2dbc=DEBUG
logging.level.org.springframework.validation=DEBUG
logging.level.org.springframework.web.reactive=DEBUG

# Management endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
cors.allowed-methods=${CORS_ALLOWED_METHODS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS}
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS}
cors.max-age=${CORS_MAX_AGE}

# Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.packages-to-scan=com.gems.auth.infrastructure.driving.rest
springdoc.paths-to-match=/api/v1/users/**
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true