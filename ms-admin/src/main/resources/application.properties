# Admin Microservice Configuration
server.port=${ADMIN_PORT}
spring.application.name=ms-admin

# R2DBC Configuration
spring.r2dbc.url=${ADMIN_R2DBC_URL}
spring.r2dbc.username=${ADMIN_R2DBC_USERNAME}
spring.r2dbc.password=${ADMIN_R2DBC_PASSWORD}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# Auth Configuration
auth.login.path=${AUTH_LOGIN_PATH}

# Rate Limiting Configuration
rate.limit.requests=${RATE_LIMIT_REQUESTS}
rate.limit.window=${RATE_LIMIT_WINDOW}
rate.limit.key.prefix=${RATE_LIMIT_KEY_PREFIX}

# Logging configuration
logging.level.com.gems.admin=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.r2dbc=DEBUG

# Management endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
cors.allowed-methods=${CORS_ALLOWED_METHODS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS}
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS}
cors.max-age=${CORS_MAX_AGE}

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
