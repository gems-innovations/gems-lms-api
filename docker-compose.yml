services:
  # Databases
  postgres-admin:
    image: postgres:16
    container_name: gems-postgres-admin
    environment:
      - POSTGRES_DB=${ADMIN_DB_NAME:-admin_db}
      - POSTGRES_USER=${ADMIN_DB_USER:-admin_user}
      - POSTGRES_PASSWORD=${ADMIN_DB_PASSWORD:?Define ADMIN_DB_PASSWORD}
    volumes:
      - postgres_admin_data:/var/lib/postgresql/data
    networks:
      - gems-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ADMIN_DB_USER:-admin_user} -d ${ADMIN_DB_NAME:-admin_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-auth:
    image: postgres:16
    container_name: gems-postgres-auth
    environment:
      - POSTGRES_DB=${AUTH_DB_NAME:-auth_db}
      - POSTGRES_USER=${AUTH_DB_USER:-auth_user}
      - POSTGRES_PASSWORD=${AUTH_DB_PASSWORD:?Define AUTH_DB_PASSWORD}
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    networks:
      - gems-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER:-auth_user} -d ${AUTH_DB_NAME:-auth_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-education:
    image: postgres:16
    container_name: gems-postgres-education
    environment:
      - POSTGRES_DB=${EDUCATION_DB_NAME:-education_db}
      - POSTGRES_USER=${EDUCATION_DB_USER:-education_user}
      - POSTGRES_PASSWORD=${EDUCATION_DB_PASSWORD:?Define EDUCATION_DB_PASSWORD}
    volumes:
      - postgres_education_data:/var/lib/postgresql/data
    networks:
      - gems-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EDUCATION_DB_USER:-education_user} -d ${EDUCATION_DB_NAME:-education_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: gems-redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Define REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - gems-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Define REDIS_PASSWORD}", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Define REDIS_PASSWORD}"]

  # Nginx Reverse Proxy (solo en una VM dedicada: `docker compose --profile edge up -d`).
  # En la VM de Oracle compartida el borde es el nginx del sistema (ops/host-nginx/gems-lms.conf),
  # que llega al gateway y al front por los puertos de loopback publicados abajo.
  nginx:
    image: nginx:alpine
    container_name: gems-nginx
    profiles: ["edge"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot
    depends_on:
      api-gateway:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - gems-network
    restart: unless-stopped

  # Frontend estático (imagen publicada por el repo gems-lms-web)
  web:
    image: ${IMAGE_REGISTRY:-ghcr.io/gems-innovations}/gems-web:${TAG:-latest}
    container_name: gems-web
    expose:
      - "80"
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-18081}:80"
    environment:
      - API_BASE_URL=${API_BASE_URL:?Define API_BASE_URL}
    networks:
      - gems-network
    restart: unless-stopped

  # Microservices
  api-gateway:
    image: ${IMAGE_REGISTRY:-ghcr.io/gems-innovations}/api-gateway:${TAG:-latest}
    container_name: gems-api-gateway
    expose:
      - "8080"
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-18080}:8080"
    environment:
      - JAVA_TOOL_OPTIONS=${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}
      - AUTH_SERVICE_URL=http://ms-auth:${AUTH_PORT:-8081}
      - ADMIN_SERVICE_URL=http://ms-admin:${ADMIN_PORT:-8082}
      - EDUCATION_SERVICE_URL=http://ms-education:${EDUCATION_PORT:-8083}
      - JWT_SECRET=${JWT_SECRET:?Define JWT_SECRET}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Define REDIS_PASSWORD}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?Define CORS_ALLOWED_ORIGINS}
      - CORS_ALLOWED_METHODS=${CORS_ALLOWED_METHODS:-GET,POST,PUT,DELETE,OPTIONS}
      - CORS_ALLOWED_HEADERS=${CORS_ALLOWED_HEADERS:-*}
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-300}
      - RATE_LIMIT_ANONYMOUS_REQUESTS=${RATE_LIMIT_ANONYMOUS_REQUESTS:-600}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-60}
      - RATE_LIMIT_KEY_PREFIX=${RATE_LIMIT_KEY_PREFIX:-rate_limit:}
    depends_on:
      ms-auth:
        condition: service_healthy
      ms-admin:
        condition: service_healthy
      ms-education:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gems-network
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: ${JAVA_MEM_LIMIT:-1g}

  ms-auth:
    image: ${IMAGE_REGISTRY:-ghcr.io/gems-innovations}/ms-auth:${TAG:-latest}
    container_name: gems-ms-auth
    expose:
      - "${AUTH_PORT:-8081}"
    environment:
      - JAVA_TOOL_OPTIONS=${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}
      - EDUCATION_SERVICE_URL=http://ms-education:${EDUCATION_PORT:-8083}
      - BOOTSTRAP_SUPERADMIN_EMAIL=${BOOTSTRAP_SUPERADMIN_EMAIL:-}
      - BOOTSTRAP_SUPERADMIN_PASSWORD=${BOOTSTRAP_SUPERADMIN_PASSWORD:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:4200}
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_STARTTLS=${MAIL_STARTTLS:-true}
      - MAIL_FROM=${MAIL_FROM:-no-reply@gems.lms}
      - AUTH_PORT=${AUTH_PORT:-8081}
      - AUTH_R2DBC_URL=r2dbc:postgresql://postgres-auth:5432/${AUTH_DB_NAME:-auth_db}
      - AUTH_R2DBC_USERNAME=${AUTH_DB_USER:-auth_user}
      - AUTH_R2DBC_PASSWORD=${AUTH_DB_PASSWORD:?Define AUTH_DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Define REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:?Define JWT_SECRET}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?Define CORS_ALLOWED_ORIGINS}
      - CORS_ALLOWED_METHODS=${CORS_ALLOWED_METHODS}
      - CORS_ALLOWED_HEADERS=${CORS_ALLOWED_HEADERS}
      - CORS_ALLOW_CREDENTIALS=${CORS_ALLOW_CREDENTIALS}
      - CORS_MAX_AGE=${CORS_MAX_AGE}
    depends_on:
      postgres-auth:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gems-network
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: ${JAVA_MEM_LIMIT:-1g}

  ms-admin:
    image: ${IMAGE_REGISTRY:-ghcr.io/gems-innovations}/ms-admin:${TAG:-latest}
    container_name: gems-ms-admin
    expose:
      - "${ADMIN_PORT:-8082}"
    environment:
      - JAVA_TOOL_OPTIONS=${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}
      - AUTH_SERVICE_URL=http://ms-auth:${AUTH_PORT:-8081}
      - ADMIN_PORT=${ADMIN_PORT:-8082}
      - ADMIN_R2DBC_URL=r2dbc:postgresql://postgres-admin:5432/${ADMIN_DB_NAME:-admin_db}
      - ADMIN_R2DBC_USERNAME=${ADMIN_DB_USER:-admin_user}
      - ADMIN_R2DBC_PASSWORD=${ADMIN_DB_PASSWORD:?Define ADMIN_DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Define REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:?Define JWT_SECRET}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?Define CORS_ALLOWED_ORIGINS}
      - CORS_ALLOWED_METHODS=${CORS_ALLOWED_METHODS}
      - CORS_ALLOWED_HEADERS=${CORS_ALLOWED_HEADERS}
      - CORS_ALLOW_CREDENTIALS=${CORS_ALLOW_CREDENTIALS}
      - CORS_MAX_AGE=${CORS_MAX_AGE}
    depends_on:
      postgres-admin:
        condition: service_healthy
    networks:
      - gems-network
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: ${JAVA_MEM_LIMIT:-1g}

  ms-education:
    image: ${IMAGE_REGISTRY:-ghcr.io/gems-innovations}/ms-education:${TAG:-latest}
    container_name: gems-ms-education
    expose:
      - "${EDUCATION_PORT:-8083}"
    environment:
      - JAVA_TOOL_OPTIONS=${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}
      - AUTH_SERVICE_URL=http://ms-auth:${AUTH_PORT:-8081}
      - FILES_DIR=/data/uploads
      - FILES_MAX_SIZE_BYTES=${FILES_MAX_SIZE_BYTES:-10485760}
      - FILES_STORAGE=${FILES_STORAGE:-local}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_PATH_STYLE=${S3_PATH_STYLE:-false}
      - S3_PREFIX=${S3_PREFIX:-uploads}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - EDUCATION_PORT=${EDUCATION_PORT:-8083}
      - EDUCATION_R2DBC_URL=r2dbc:postgresql://postgres-education:5432/${EDUCATION_DB_NAME:-education_db}
      - EDUCATION_R2DBC_USERNAME=${EDUCATION_DB_USER:-education_user}
      - EDUCATION_R2DBC_PASSWORD=${EDUCATION_DB_PASSWORD:?Define EDUCATION_DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Define REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:?Define JWT_SECRET}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?Define CORS_ALLOWED_ORIGINS}
      - CORS_ALLOWED_METHODS=${CORS_ALLOWED_METHODS}
      - CORS_ALLOWED_HEADERS=${CORS_ALLOWED_HEADERS}
      - CORS_ALLOW_CREDENTIALS=${CORS_ALLOW_CREDENTIALS}
      - CORS_MAX_AGE=${CORS_MAX_AGE}
    depends_on:
      postgres-education:
        condition: service_healthy
    volumes:
      - uploaded_files:/data/uploads
    networks:
      - gems-network
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: ${JAVA_MEM_LIMIT:-1g}

volumes:
  uploaded_files:
  postgres_admin_data:
  postgres_auth_data:
  postgres_education_data:
  redis_data:

networks:
  gems-network:
    driver: bridge
    name: gems-lms-network
