# Subdominios de instituciones: <slug>.gemsinnovations.com (unal, pragma, knowledgecraft, ...).
# Un solo bloque atiende a todas: el front lee el subdominio en el navegador y carga la marca de esa institución.
#
# nginx da prioridad a los nombres exactos (lms.* y api.* de gems-lms.conf) sobre esta expresión regular.
# Requiere el certificado comodín (setup-vm.sh lo emite con WILDCARD_CERTBOT_ARGS) y el DNS *.gemsinnovations.com.
# Se instala en /etc/nginx/sites-available/gems-lms-instituciones solo si ese certificado existe: un
# ssl_certificate faltante haría fallar nginx -t y afectaría a los demás sitios de la VM.
#
# Los upstreams gems_lms_web y gems_lms_gateway los define gems-lms.conf.

server {
    listen 80;
    server_name ~^(?<institucion>[a-z0-9-]+)\.gemsinnovations\.com$;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name ~^(?<institucion>[a-z0-9-]+)\.gemsinnovations\.com$;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/wildcard.gemsinnovations.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wildcard.gemsinnovations.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Mismo front estático de lms: sus encabezados de seguridad (CSP, etc.) los pone el nginx de la imagen.
    location / {
        proxy_pass http://gems_lms_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
