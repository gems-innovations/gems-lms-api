# Sitio del LMS en el nginx del sistema de la VM de Oracle (compartida con otros proyectos).
# Se instala en /etc/nginx/sites-available/gems-lms con ops/setup-vm.sh.
# El compose publica el gateway y el front solo en loopback (GATEWAY_HOST_PORT / WEB_HOST_PORT).

upstream gems_lms_gateway { server 127.0.0.1:18080; keepalive 16; }
upstream gems_lms_web     { server 127.0.0.1:18081; keepalive 8; }

server {
    listen 80;
    server_name lms.gemsinnovations.com api.auth.gemsinnovations.com api.admin.gemsinnovations.com api.edu.gemsinnovations.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Front estático (imagen gems-web). Sus encabezados de seguridad (CSP, etc.) los pone el nginx de la imagen.
server {
    listen 443 ssl http2;
    server_name lms.gemsinnovations.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/lms.gemsinnovations.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lms.gemsinnovations.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://gems_lms_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API: un solo punto de entrada (api.auth) y los alias históricos api.admin y api.edu.
# Todo pasa por el gateway para conservar rate limit, validación de sesión y auditoría.
server {
    listen 443 ssl http2;
    server_name api.auth.gemsinnovations.com api.admin.gemsinnovations.com api.edu.gemsinnovations.com;
    server_tokens off;

    # Cargas multipart hasta el límite del API (10 MB).
    client_max_body_size 11m;

    ssl_certificate     /etc/letsencrypt/live/api.auth.gemsinnovations.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.auth.gemsinnovations.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /actuator/prometheus { return 404; }
    location ~ ^/(swagger-ui|v3/api-docs|webjars)(/|$) { return 404; }
    # Rutas entre servicios: nunca desde Internet.
    location ^~ /internal/ { return 404; }

    location / {
        proxy_pass http://gems_lms_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
