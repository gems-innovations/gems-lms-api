plugins {
  id 'java'
  id 'org.springframework.boot' version '3.4.5' apply false
  id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
  group = 'gems.com'
  version = '1.0.0'

  repositories {
    mavenCentral()
  }
}

subprojects {
  apply plugin: 'java'
  apply plugin: 'jacoco'
  apply plugin: 'org.springframework.boot'
  apply plugin: 'io.spring.dependency-management'


  java {
    toolchain {
      languageVersion = JavaLanguageVersion.of(24)
    }
  }


  dependencies {
    if (project.name != 'shared') {
      implementation 'org.springframework.boot:spring-boot-starter'
      implementation 'org.springframework.boot:spring-boot-starter-webflux'
      testImplementation 'org.springframework.boot:spring-boot-starter-test'
      testImplementation 'io.projectreactor:reactor-test'
    }

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
  }


  test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
  }

  jacocoTestReport {
    dependsOn test
    reports {
      xml.required = true
      html.required = true
      csv.required = false
    }
  }

  jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
      rule {
        limit {
          minimum = 0.85
        }
      }
    }
  }

  check.dependsOn jacocoTestCoverageVerification

  task coverageReport {
    dependsOn jacocoTestReport
    doLast {
      def reportFile = file("${project.buildDir}/reports/jacoco/test/html/index.html")
      if (reportFile.exists()) {
        println "\n" + "=" * 60
        println "COBERTURA DE CÓDIGO - ${project.name.toUpperCase()}"
        println "=" * 60

        def html = reportFile.text
        def coverageMatch = html =~ /Total.*?(\d+)%/
        if (coverageMatch) {
          def coverage = coverageMatch[0][1]
          println "Cobertura actual: ${coverage}%"
          println "Cobertura mínima requerida: 85%"

          if (coverage.toInteger() >= 85) {
            println "¡Cobertura SUFICIENTE! (${coverage}% >= 85%)"
          } else {
            println "Cobertura INSUFICIENTE! (${coverage}% < 85%)"
            println "Necesitas mejorar la cobertura en ${85 - coverage.toInteger()} puntos porcentuales"
          }
        }
        println "Reporte HTML disponible en: ${reportFile.absolutePath}"
        println "=" * 60 + "\n"
      }
    }
  }

  test.finalizedBy coverageReport
}